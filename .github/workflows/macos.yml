name: Mac app checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  CONGRESSTRACK_RELEASE: '0'

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests-release -v
      - run: swift test
      - run: bash scripts/build-app.sh
        env:
          CONGRESSTRACK_UNIVERSAL: '1'
      - name: Verify signed updates and reject tampered packages
        run: bash scripts/test-updates.sh
      - name: Smoke-test packaged app
        run: swift scripts/smoke-app.swift dist/CongressTrack.app/Contents/MacOS/CongressTrack x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: CongressTrack-macOS
          path: |
            dist/CongressTrack-macOS.zip
            dist/CongressTrack.dmg
            dist/CongressTrack-symbols.zip
  launch:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test --filter WindowLayoutTests
      - uses: actions/download-artifact@v4
        with:
          name: CongressTrack-macOS
          path: dist
      - name: Unpack and launch Apple silicon package
        run: |
          ditto -x -k dist/CongressTrack-macOS.zip dist
          swift scripts/smoke-app.swift dist/CongressTrack.app/Contents/MacOS/CongressTrack arm64
  prerelease:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: [build, launch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CongressTrack-macOS
          path: dist
      - name: Publish unsigned development prerelease
        run: python3 scripts/publish-development.py
        env:
          GH_TOKEN: ${{ github.token }}
