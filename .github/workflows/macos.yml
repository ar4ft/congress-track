name: Mac app checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests-release -v
      - run: swift test
      - run: bash scripts/build-app.sh
        env:
          CONGRESSTRACK_UNIVERSAL: '1'
      - name: Verify signed updates and reject tampered packages
        run: bash scripts/test-updates.sh
      - name: Smoke-test packaged app
        run: |
          dist/CongressTrack.app/Contents/MacOS/CongressTrack > /tmp/congresstrack-smoke.log 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat /tmp/congresstrack-smoke.log
            exit 1
          fi
          kill "$APP_PID"
      - uses: actions/upload-artifact@v4
        with:
          name: CongressTrack-macOS
          path: |
            dist/CongressTrack-macOS.zip
            dist/CongressTrack.dmg
            dist/CongressTrack-symbols.zip
