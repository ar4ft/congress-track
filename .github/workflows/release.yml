name: Mac build or signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Branch/tag for development; existing matching version tag for signed release (e.g. v0.3.0)
        required: false
        type: string
      signed_release:
        description: Sign, notarize, and publish a production release (requires Apple credentials)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: congresstrack-production-release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  development:
    if: ${{ !inputs.signed_release }}
    runs-on: macos-15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Record development source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests-release -v
      - run: swift test
      - name: Build development app without release signing
        run: bash scripts/build-app.sh
        env:
          CONGRESSTRACK_RELEASE: '0'
          CONGRESSTRACK_UNIVERSAL: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: CongressTrack-development
          path: |
            dist/CongressTrack-macOS.zip
            dist/CongressTrack.dmg
            dist/CongressTrack-symbols.zip
  prerelease:
    if: ${{ !inputs.signed_release }}
    needs: development
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.development.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: CongressTrack-development
          path: dist
      - name: Publish unsigned development prerelease
        run: python3 scripts/publish-development.py
        env:
          GH_TOKEN: ${{ github.token }}
          CONGRESSTRACK_RELEASE: '0'
  release:
    if: ${{ inputs.signed_release }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CONGRESSTRACK_RELEASE: '1'
      CONGRESSTRACK_UNIVERSAL: '1'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify release prerequisites and import credentials
        run: python3 scripts/prepare-release.py
      - name: Verify Sparkle signing keypair
        run: swift scripts/validate-update-key.swift
      - name: Run tests
        run: |
          python3 -m unittest discover -s tests-release -v
          swift test
      - name: Build, sign, notarize, and staple application and installer
        run: bash scripts/build-app.sh
      - name: Generate and verify signed update feed
        run: bash scripts/generate-appcast.sh
      - name: Smoke-test signed app
        run: |
          dist/CongressTrack.app/Contents/MacOS/CongressTrack > /tmp/congresstrack-release-smoke.log 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat /tmp/congresstrack-release-smoke.log
            exit 1
          fi
          kill "$APP_PID"
      - name: Remove temporary signing credentials
        if: always()
        run: python3 scripts/cleanup-release.py
      - name: Publish verified GitHub Release
        run: python3 scripts/publish-release.py
      - name: Preserve debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: CongressTrack-symbols-${{ env.RELEASE_TAG }}
          path: dist/CongressTrack-symbols.zip
